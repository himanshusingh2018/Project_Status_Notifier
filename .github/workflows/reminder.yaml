    runs-on: ubuntu-latest
    steps:
      - name: Send email directly from Gmail
        uses: action-pack/send-mail@v1
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.himanshu720 }}
          password: ${{ secrets.cdimwzdsjqxjayhp }}
          subject: 'Pending Tasks Reminder'
          body: 'Please check your GitHub Board for pending tasks.'
          to: 'himanshu720@gmail.com'
          from: 'GitHub Actions Reminder'

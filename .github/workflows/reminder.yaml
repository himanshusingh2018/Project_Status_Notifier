name: Daily Project Status Email Reminder

on:
  schedule:
    # 7:00 AM, 12:00 PM, 4:00 PM, and 8:00 PM EST (12:00, 17:00, 21:00, 01:00 UTC)
    - cron: '0 12,17,21,1 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fetch and Format Project Status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_PAT }}
          GITHUB_USER: "himanshusingh2018"
          PROJECT_NUMBER: 7
        run: |
          set -euo pipefail

          QUERY='
          query($user: String!, $number: Int!) {
            user(login: $user) {
              projectV2(number: $number) {
                items(first: 100) {
                  nodes {
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                    content {
                      ... on Issue {
                        title
                        url
                      }
                      ... on PullRequest {
                        title
                        url
                      }
                      ... on DraftIssue {
                        title
                      }
                    }
                  }
                }
              }
            }
          }'

          RESPONSE=$(gh api graphql \
            -F user="$GITHUB_USER" \
            -F number="$PROJECT_NUMBER" \
            -f query="$QUERY")

          ITEMS_JSON=$(echo "$RESPONSE" | jq '[
            .data.user.projectV2.items.nodes[]
            | select(.content != null)
            | {
                status: (.fieldValueByName.name // "Todo"),
                title: .content.title,
                url: (.content.url // "")
              }
          ]')

          render_html_list() {
            local filter_condition="$1"
            echo "$ITEMS_JSON" | jq -r --argjson cond "$filter_condition" '
              map(select(.status as $s | $cond | index($s)))
              | if length == 0 then
                  "<li><em>None</em></li>"
                else
                  to_entries | map("<li>" + (.key + 1 | tostring) + ". " + (if .value.url != "" then "<a href=\"" + .value.url + "\">" + .value.title + "</a>" else .value.title end) + "</li>") | join("\n")
                end
            '
          }

          TODO_FILTER='["Todo"]'
          IN_PROGRESS_FILTER='["In Progress"]'
          DONE_FILTER='["Done"]'

          TODO_HTML=$(render_html_list "$TODO_FILTER")
          IN_PROGRESS_HTML=$(render_html_list "$IN_PROGRESS_FILTER")
          DONE_HTML=$(render_html_list "$DONE_FILTER")
          REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat <<EOF > email_body.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292f; }
              h2 { border-bottom: 1px solid #d0d7de; padding-bottom: 6px; }
              h3 { margin-top: 20px; margin-bottom: 6px; }
              .todo-header { color: #57606a; }
              .in-progress-header { color: #bf8700; }
              .done-header { color: #1a7f37; }
              ul { list-style-type: none; padding-left: 0; }
              li { margin-bottom: 6px; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
              em { color: #57606a; }
            </style>
          </head>
          <body>
            <h2>Project #7 Status Report</h2>
            <p><strong>Run Time:</strong> ${REPORT_DATE}</p>

            <h3 class="todo-header">📋 To Do</h3>
            <ul>
              ${TODO_HTML}
            </ul>

            <h3 class="in-progress-header">⏳ In Progress</h3>
            <ul>
              ${IN_PROGRESS_HTML}
            </ul>

            <h3 class="done-header">✅ Completed</h3>
            <ul>
              ${DONE_HTML}
            </ul>
          </body>
          </html>
          EOF

      - name: Send Email via Gmail SSL
        env:
          SMTP_USER: "himanshu720@gmail.com"
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: "himanshu720@gmail.com"
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          username = os.environ.get("SMTP_USER", "").strip()
          password = os.environ.get("SMTP_PASS", "").strip()
          to_addr = os.environ.get("TO_EMAIL", "").strip()

          if not password:
              print("::error::SMTP_PASSWORD secret is missing or empty in Repository Secrets! Go to Settings -> Secrets and variables -> Actions to add it.")
              sys.exit(1)

          with open("email_body.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Project #7 Status Digest"
          msg["From"] = f"GitHub Project Reminder <{username}>"
          msg["To"] = to_addr
          msg.attach(MIMEText(html_content, "html", "utf-8"))

          print(f"Connecting to smtp.gmail.com:465 with user {username}...")
          try:
              server = smtplib.SMTP_SSL("smtp.gmail.com", 465)
              server.login(username, password)
              server.sendmail(username, [to_addr], msg.as_string())
              server.quit()
              print("✅ Email sent successfully to " + to_addr)
          except smtplib.SMTPAuthenticationError as e:
              print(f"::error::Gmail login rejected (code {e.smtp_code}): {e.smtp_error.decode('utf-8', errors='ignore')}")
              print("Please ensure your Google App Password is a valid 16-character code with NO spaces and 2-Step Verification is active.")
              sys.exit(1)
          except Exception as e:
              print(f"::error::SMTP error: {e}")
              sys.exit(1)
          EOF

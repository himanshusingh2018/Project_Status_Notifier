name: Print Work Status

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  print-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fetch and Print Status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_PAT }}
          GITHUB_USER: "himanshusingh2018"
          PROJECT_NUMBER: 7
        run: |
          set -euo pipefail

          QUERY='
          query($user: String!, $number: Int!) {
            user(login: $user) {
              projectV2(number: $number) {
                items(first: 100) {
                  nodes {
                    fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                    content {
                      ... on Issue {
                        title
                        url
                      }
                      ... on PullRequest {
                        title
                        url
                      }
                      ... on DraftIssue {
                        title
                      }
                    }
                  }
                }
              }
            }
          }'

          # Fetch Project items via GraphQL
          RESPONSE=$(gh api graphql \
            -F user="$GITHUB_USER" \
            -F number="$PROJECT_NUMBER" \
            -f query="$QUERY")

          # Normalize items into a clean JSON array
          ITEMS_JSON=$(echo "$RESPONSE" | jq '[
            .data.user.projectV2.items.nodes[]
            | select(.content != null)
            | {
                status: (.fieldValueByName.name // "Todo"),
                title: .content.title,
                url: (.content.url // "")
              }
          ]')

          # Helper function to generate numbered console text
          render_console_list() {
            local filter_condition="$1"
            echo "$ITEMS_JSON" | jq -r --argjson cond "$filter_condition" '
              map(select(.status as $s | $cond | index($s)))
              | if length == 0 then
                  "  (None)"
                else
                  to_entries | map("  " + (.key + 1 | tostring) + ". " + .value.title + (if .value.url != "" then " (" + .value.url + ")" else "" end)) | join("\n")
                end
            '
          }

          # Helper function to generate numbered Markdown list
          render_markdown_list() {
            local filter_condition="$1"
            echo "$ITEMS_JSON" | jq -r --argjson cond "$filter_condition" '
              map(select(.status as $s | $cond | index($s)))
              | if length == 0 then
                  "_None_"
                else
                  to_entries | map((.key + 1 | tostring) + ". [" + .value.title + "](" + (if .value.url != "" then .value.url else "#" end) + ")") | join("\n")
                end
            '
          }

          PENDING_FILTER='["Todo", "In Progress"]'
          COMPLETED_FILTER='["Done"]'

          # 1. Output to runner console logs
          echo "================================================"
          echo "Pending"
          render_console_list "$PENDING_FILTER"
          echo ""
          echo "Completed"
          render_console_list "$COMPLETED_FILTER"
          echo "================================================"

          # 2. Output to GitHub Summary UI
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### Pending
          $(render_markdown_list "$PENDING_FILTER")

          ### Completed
          $(render_markdown_list "$COMPLETED_FILTER")
          EOF
